<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3</title>
</head>
<body>
    <h1>Задача 3</h1>
    <p>
        Дано вартість одиниці товару і кількість. Знайти загальну вартість та ПДВ (5% від загальної вартості).
    </p>

    <script>
        const VAT_PERCENT = 5;
        const Value = parseFloat(prompt('Введіть вартість одиниці товару:', '9.99').replace(',', '.'));
        const Quant = parseInt(prompt('Введіть кількість товару:', '3'));

        const totalValue = Value * Quant;
        const VAT = totalValue * (VAT_PERCENT / 100);
        const totalValueWithVAT = totalValue + VAT;

        document.write(`
        Загальна вартість = ${totalValue.toFixed(2)}; <br>
        ПДВ (${VAT_PERCENT}%) = ${VAT.toFixed(2)}; <br>
        Загальна вартість з ПДВ = ${totalValueWithVAT.toFixed(2)}`);
    </script>
</body>
</html>
