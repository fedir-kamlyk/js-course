<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 5</title>
</head>
<body>
    <h1>Задача 5</h1>
    <p>
        Дано кількість секунд, що пройшла від початку доби. Визначити скільки це годин і хвилин.
    </p>

    <script>
        const Sec = parseInt(prompt('Введіть кількість секунд, що пройшла від початку доби:', '25673'));
        
        if (Sec < 0) {
            alert(`Помилка! Кількість секунд не може бути від'ємною.`);
            document.write(`Введено некоректні дані.`);
        } else {
            const Hrs = Math.floor(Sec / 3600);
            const remainSec = Sec % 3600;
            const Min = Math.floor(remainSec / 60);

            document.write(`
                Пройшло секунд: ${Sec} <br>
                Це: ${Hrs} годин(и) та ${Min} хвилин(и).`);
        }
    </script>
</body>
</html>
